worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    server {
        listen 4000;
        # Only these routes reach LiteLLM. Login, UI, SSO and future routes fail closed.
        location ~ ^/health/(readiness|liveliness)$ {
            if ($request_method != GET) { return 405; }
            proxy_pass http://127.0.0.1:4001;
        }
        location ~ ^/v1beta/models/[a-zA-Z0-9._-]+:(generateContent|streamGenerateContent|countTokens)$ {
            if ($request_method != POST) { return 405; }
            proxy_pass http://127.0.0.1:4001;
        }
        # LiteLLM requires the master key here; agent keys cannot provision keys.
        location ~ ^/key/(generate|delete)$ {
            if ($request_method != POST) { return 405; }
            proxy_pass http://127.0.0.1:4001;
        }
        location / { return 404; }
    }
}
