# Local IBKR Client Portal gateway for manual tests.
# Ports are bound to 127.0.0.1 only. Sign in yourself at https://localhost:5055.
services:
  gateway:
    build:
      context: ./api_gateway
    image: ibkr-gateway:local
    ports:
      - "127.0.0.1:5055:5055"
      - "127.0.0.1:5056:5056"
    environment:
      GATEWAY_PORT: "5055"
      LOGIN_SERVER_PORT: "5056"
      GATEWAY_INTERNAL_BASE_URL: https://localhost
      GATEWAY_TEST_ENDPOINT: /v1/api/one/user
      TICKLE_BASE_URL: https://localhost:5055
      TICKLE_ENDPOINT: /v1/api/tickle
      TICKLE_INTERVAL: "55"
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
