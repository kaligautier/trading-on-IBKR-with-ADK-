[project]
name = "deepcopy-mcp"
version = "0.1.0"
description = "Read-only Deepcopy MCP server on the Deepcopy API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp==4.1.6",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "python-json-logger>=4,<5",
    "starlette>=0.48,<2",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
telemetry = ["opentelemetry-distro>=0.58b0", "opentelemetry-exporter-otlp>=1.37"]

[project.scripts]
deepcopy-mcp = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.14",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "N", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastmcp.dependencies.CurrentContext", "fastmcp.dependencies.Depends"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
