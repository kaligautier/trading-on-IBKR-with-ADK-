[project]
name = "market-scanner-api"
version = "0.1.0"
description = "Read-only market scanner consultation API"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.0",
    "jsonschema>=4.25.0",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.10.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "N",  # pep8-naming
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
python_files = "test_*.py"
python_functions = ["test_*", "should_*"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.1",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.0.0",
    "mypy>=1.18.0",
    "types-jsonschema>=4.25.0",
    "ruff>=0.14.7",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/app"]
