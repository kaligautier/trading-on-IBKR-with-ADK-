[loggers]
keys=root,uvicornAccess,gunicornAccess

[handlers]
keys=consoleHandler

[formatters]
keys=json

[logger_root]
level=INFO
handlers=consoleHandler

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=json
args=(sys.stdout,)

[formatter_json]
class=app.utils.logger.JsonFormatter

[logger_uvicornAccess]
level=WARNING
handlers=consoleHandler
qualname=uvicorn.access
propagate=0

[logger_gunicornAccess]
level=WARNING
handlers=consoleHandler
qualname=gunicorn.access
propagate=0
