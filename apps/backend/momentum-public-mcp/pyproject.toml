[project]
name = "mcp-momentum-public"
version = "0.1.0"
description = "Public Momentum MCP server for analysis consultation and moderated suggestions"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastmcp==4.1.3",
    "fastmcp-slim[client,server]==4.1.3",
    "httpx>=0.28.0,<0.29.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.14.2",
]

[project.scripts]
momentum-public-mcp = "momentum_public_mcp.main:main"

[dependency-groups]
build = ["hatchling==1.32.4"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff==0.17.2",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momentum_public_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "N"]
