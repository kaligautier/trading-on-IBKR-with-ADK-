[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "momentum-adk"
version = "0.1.0"
description = "Independent Momentum ADK financial analysis engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30,<1",
    "google-adk[db]==2.6.1",
    "pydantic>=2.11.4,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
dev = ["pytest>=8.4.1,<9", "pytest-asyncio>=1.0,<2", "ruff==0.14.7"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "N"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
markers = ["unit: isolated tests", "integration: disposable service tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
