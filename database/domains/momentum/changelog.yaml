databaseChangeLog:
  - preConditions:
      - onFail: HALT
      - sqlCheck:
          expectedResult: '1'
          sql: "SELECT CASE WHEN current_database() = 'momentum' AND current_user = 'database_migrator' THEN 1 ELSE 0 END"
  - changeSet:
      id: momentum-aiven-20261023
      author: deepcopy
      changes:
        - sqlFile:
            path: baseline.sql
            relativeToChangelogFile: true
  - changeSet:
      id: momentum-aiven-20261023-tag
      author: deepcopy
      changes:
        - tagDatabase:
            tag: aiven-20261023
  - include:
      file: ../../changelog/momentum-unified/trader-ratio-text.sql
      relativeToChangelogFile: true
      logicalFilePath: momentum-unified/trader-ratio-text.sql
  - include:
      file: migrations/001-trading-memory.sql
      relativeToChangelogFile: true
