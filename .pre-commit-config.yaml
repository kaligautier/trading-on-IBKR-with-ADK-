repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep aligned with the global Lint workflow and root justfile.
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix, --extend-select, C90, --config, 'lint.mccabe.max-complexity=10']
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
