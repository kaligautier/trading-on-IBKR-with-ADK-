name: Pull request size

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate at the selected head commit
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: pr-size-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  pr-size:
    name: PR size
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Start required check on the PR head
        id: head-check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK_NAME: PR size
        run: |
          set -euo pipefail
          check_id=$(gh api --method POST "repos/${GH_REPO}/check-runs" \
            -f name="$CHECK_NAME" -f head_sha="$PR_HEAD_SHA" \
            -f status=in_progress \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq '.id')
          printf 'id=%s\n' "$check_id" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The proposed PR cannot change its own counting/exclusion policy.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test the PR rules
        run: jq -n -L .github/pr-policy --slurpfile cases .github/pr-policy/tests/cases.json -f .github/pr-policy/tests/run.jq
      - name: Read all changed files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh api --paginate --slurp "repos/${GH_REPO}/pulls/${PR_NUMBER}/files?per_page=100" > "$RUNNER_TEMP/pr-files.json"
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
      - name: Enforce the 1,000-line limit excluding lockfiles
        run: |
          set -euo pipefail
          jq -n -L .github/pr-policy --slurpfile pr "$RUNNER_TEMP/pr.json" \
            --slurpfile pages "$RUNNER_TEMP/pr-files.json" --arg head "$PR_HEAD_SHA" \
            'include "policy"; pr_files($pr[0]; $pages[0]; $head) | size' \
            > "$RUNNER_TEMP/result.json" 2> "$RUNNER_TEMP/error.txt" || {
            echo "::error::$(sed 's/^jq: error[^:]*: //' "$RUNNER_TEMP/error.txt")"; exit 1; }
          read -r additions deletions ignored total < <(jq -r '"\(.additions) \(.deletions) \(.ignored) \(.total)"' "$RUNNER_TEMP/result.json")
          {
            echo "### PR size: $total / 1000 lines"
            echo
            echo "$additions additions + $deletions deletions. Excluded $ignored generated lockfile(s): package-lock.json and uv.lock."
          } | tee "$GITHUB_STEP_SUMMARY"
          if (( total > 1000 )); then
            echo "::error::PR exceeds 1,000 counted lines. Split this change into smaller PRs."
            exit 1
          fi
      - name: Complete required check on the validated PR head
        if: always() && steps.head-check.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK_ID: ${{ steps.head-check.outputs.id }}
          CONCLUSION: ${{ job.status }}
        run: |
          gh api --method PATCH "repos/${GH_REPO}/check-runs/${CHECK_ID}" \
            -f status=completed -f conclusion="$CONCLUSION" \
            --jq '.html_url'
