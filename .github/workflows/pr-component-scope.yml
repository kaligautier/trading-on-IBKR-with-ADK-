name: Pull request component scope

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-component-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  component-scope:
    name: PR component scope
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test the component scope rule
        run: python3 -m unittest discover -s .github/scripts -p 'test_pr_components.py' -v
      - name: Read all changed files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GH_REPO}/pulls/${PR_NUMBER}/files?per_page=100" > "$RUNNER_TEMP/pr-files.json"
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
      - name: Enforce one component per pull request
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/check_pr_components.py \
            "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/pr-files.json" "$PR_HEAD_SHA"
