name: Pull request component scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate at the selected head commit
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: pr-component-scope-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  component-scope:
    name: PR component scope
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Start required check on the PR head
        id: head-check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK_NAME: PR component scope
        run: |
          set -euo pipefail
          check_id=$(gh api --method POST "repos/${GH_REPO}/check-runs" \
            -f name="$CHECK_NAME" -f head_sha="$PR_HEAD_SHA" \
            -f status=in_progress \
            -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq '.id')
          printf 'id=%s\n' "$check_id" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Never execute a PR-controlled validator, including in a stacked base.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test the component scope rule
        run: jq -n -L .github/pr-policy --slurpfile cases .github/pr-policy/tests/cases.json -f .github/pr-policy/tests/run.jq
      - name: Read all changed files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh api --paginate --slurp "repos/${GH_REPO}/pulls/${PR_NUMBER}/files?per_page=100" > "$RUNNER_TEMP/pr-files.json"
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
      - name: Enforce one component per pull request
        run: |
          set -euo pipefail
          jq -n -L .github/pr-policy --slurpfile pr "$RUNNER_TEMP/pr.json" \
            --slurpfile pages "$RUNNER_TEMP/pr-files.json" --arg head "$PR_HEAD_SHA" \
            'include "policy"; pr_files($pr[0]; $pages[0]; $head) | components' \
            > "$RUNNER_TEMP/result.json" 2> "$RUNNER_TEMP/error.txt" || {
            echo "::error::$(sed 's/^jq: error[^:]*: //' "$RUNNER_TEMP/error.txt")"; exit 1; }
          count=$(jq length "$RUNNER_TEMP/result.json")
          {
            echo "### PR component scope: $count / 1"
            echo
            echo "Components: $(jq -c . "$RUNNER_TEMP/result.json")"
            echo
            echo "Shared files outside component directories do not count. Renames count both the old and new component."
          } | tee "$GITHUB_STEP_SUMMARY"
          if (( count > 1 )); then
            echo "::error::A PR may modify at most one application component. Split this PR."
            exit 1
          fi
      - name: Complete required check on the validated PR head
        if: always() && steps.head-check.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK_ID: ${{ steps.head-check.outputs.id }}
          CONCLUSION: ${{ job.status }}
        run: |
          gh api --method PATCH "repos/${GH_REPO}/check-runs/${CHECK_ID}" \
            -f status=completed -f conclusion="$CONCLUSION" \
            --jq '.html_url'
