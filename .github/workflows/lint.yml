name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: '0.12.2'

      - name: Run Ruff linter including complexity
        run: >-
          uvx ruff==0.17.2 check --output-format=github
          --extend-select C90 --config 'lint.mccabe.max-complexity=10'
          --config 'include=["*.py", "*.pyi"]' .

      - name: Run Ruff formatter
        run: >-
          uvx ruff==0.17.2 format --check
          --config 'include=["*.py", "*.pyi"]' .
