name: Pull request policy tests

on:
  pull_request:
    paths:
      - '.github/pr-policy/**'
      - '.github/workflows/pr-*.yml'

permissions:
  contents: read

concurrency:
  group: pr-policy-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy-tests:
    name: PR policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: jq -n -L .github/pr-policy --slurpfile cases .github/pr-policy/tests/cases.json -f .github/pr-policy/tests/run.jq
