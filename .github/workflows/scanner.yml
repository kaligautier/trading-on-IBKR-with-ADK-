name: Scanner checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/market-scanner-adk/**'
      - 'infra/**'
      - '.github/workflows/scanner.yml'
      - '.github/workflows/scanner-checks.yml'
      - 'scripts/scanner_image_smoke.py'
      - '.github/scripts/verify_adk_telemetry.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/scanner-checks.yml

  publish:
    # Publication is explicitly enabled by each repository owner, never by a PR.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.SCANNER_PUBLISH_ENABLED == 'true'
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: scanner-release
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      PUBLISHER: ${{ vars.GCP_ARTIFACT_PUBLISHER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$GCP_REGION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]]
          [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]
          [[ "$PUBLISHER" == *@"$GCP_PROJECT_ID".iam.gserviceaccount.com ]]
          echo "IMAGE=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/market-scanner/market-scanner-adk:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Build release image before obtaining credentials
        run: docker build --platform linux/amd64 --tag "$IMAGE" apps/backend/market-scanner-adk
      - name: Verify the image to be published
        run: python3 scripts/scanner_image_smoke.py "$IMAGE"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.PUBLISHER }}
          token_format: access_token
          create_credentials_file: false
      - name: Publish verified image and record its immutable reference
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          DOCKER_CONFIG: ${{ runner.temp }}/scanner-docker-auth
        shell: bash
        run: |
          set -euo pipefail
          registry="$GCP_REGION-docker.pkg.dev"
          trap 'docker logout "$registry" >/dev/null 2>&1 || true' EXIT
          printf '%s' "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin "$registry"
          docker push "$IMAGE"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          [[ "$digest" =~ @sha256:[a-f0-9]{64}$ ]]
          printf '### Scanner image\n\nCommit: `%s`\n\nTerraform input:\n```hcl\nimage = "%s"\n```\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
