name: Scanner checks

on:
  pull_request:
    paths:
      - 'apps/backend/market-scanner-api/**'
      - 'database/**'
      - '.github/actions/domain-database/**'
      - 'apps/backend/market-scanner-adk/**'
      - 'infra/**'
      - '.github/workflows/scanner.yml'
      - 'scripts/scanner_image_smoke.py'
      - '.github/scripts/verify_adk_telemetry.py'
  push:
    branches: [main]
    paths:
      - 'apps/backend/market-scanner-api/**'
      - 'database/**'
      - '.github/actions/domain-database/**'
      - 'apps/backend/market-scanner-adk/**'
      - 'infra/**'
      - '.github/workflows/scanner.yml'
      - 'scripts/scanner_image_smoke.py'
      - '.github/scripts/verify_adk_telemetry.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend/market-scanner-adk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.17'
          enable-cache: true
          cache-dependency-glob: apps/backend/market-scanner-adk/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Lint application and tests
        run: uv run --no-sync ruff check src ../../../scripts/scanner_image_smoke.py
      - name: Check formatting
        run: uv run --no-sync ruff format --check src/app ../../../scripts/scanner_image_smoke.py
      - name: Test scanner and gateway failure handling
        run: TZ=UTC uv run --no-sync pytest -q src/test/unit
      - name: Verify locked ADK and OpenTelemetry compatibility offline
        run: uv run --no-sync python ../../../.github/scripts/verify_adk_telemetry.py

  database:
    # Scanner and reader tests on the domain database migrated by the Liquibase CLI.
    # The reader test reads the report the scanner tests write, so they run in order.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
      PGSSLMODE: disable
      RUN_DOMAIN_TESTS: '1'
      SHARED: deepcopy-current-scanner-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/domain-database
        with:
          domains: market_scanner
      - name: Start the disposable PostgreSQL for shared-root migration tests
        run: |
          set -euo pipefail
          docker run --detach --rm --name "$SHARED" --label org.deepcopy.scanner-tests=true \
            --publish 127.0.0.1:55466:5432 --env POSTGRES_PASSWORD=local-test-only \
            postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          for attempt in $(seq 60); do
            docker exec "$SHARED" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && exit 0
            sleep 1
          done
          exit 1
      - name: Start the admission (15 slots) and TLS PostgreSQL servers for worker tests
        run: |
          set -euo pipefail
          image=postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          docker run --detach --rm --name worker-admission --publish 127.0.0.1:55474:5432 \
            --env POSTGRES_PASSWORD=domain-test-only "$image" \
            -c max_connections=15 -c superuser_reserved_connections=3
          tls="$RUNNER_TEMP/worker-tls" && mkdir -p "$tls"
          for name in server untrusted; do
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
              -addext subjectAltName=DNS:localhost \
              -keyout "$tls/$name.key" -out "$tls/$name.pem" 2>/dev/null
          done
          docker create --name worker-tls --publish 127.0.0.1:55473:5432 \
            --env POSTGRES_PASSWORD=domain-test-only "$image" bash -c \
            'chown postgres:postgres /tmp/server.*; chmod 600 /tmp/server.key; exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.pem -c ssl_key_file=/tmp/server.key' >/dev/null
          docker cp "$tls/server.pem" worker-tls:/tmp/server.pem
          docker cp "$tls/server.key" worker-tls:/tmp/server.key
          docker start worker-tls >/dev/null
          for server in worker-admission worker-tls; do
            for attempt in $(seq 60); do
              docker exec "$server" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
              [[ "$attempt" == 60 ]] && { docker logs "$server"; exit 1; }
              sleep 1
            done
          done
          docker exec -i worker-admission psql -X -q -v ON_ERROR_STOP=1 -U postgres <<'SQL'
          CREATE DATABASE market_scanner;
          CREATE ROLE market_scanner_writer LOGIN PASSWORD 'domain-test-only' CONNECTION LIMIT 2;
          SQL
          {
            echo "WORKER_ADMISSION_TEST_URL=postgresql://market_scanner_writer:domain-test-only@127.0.0.1:55474/market_scanner"
            echo "WORKER_TLS_TEST_URL=postgresql://postgres:domain-test-only@localhost:55473/postgres?sslmode=verify-full"
            echo "WORKER_TLS_TEST_CA=$tls/server.pem"
            echo "WORKER_TLS_UNTRUSTED_CA=$tls/untrusted.pem"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.17'
          enable-cache: true
      - name: Scanner tests, including the database ones
        working-directory: apps/backend/market-scanner-adk
        env:
          MARKET_SHARED_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:55466/postgres
          MARKET_SHARED_TEST_CONTAINER: ${{ env.SHARED }}
        run: |
          uv sync --locked --python 3.12
          uv run --no-sync pytest -q --tb=short src/test
      - name: Reader tests, including the one reading the scanner report
        working-directory: apps/backend/market-scanner-api
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:55466/scanner_reader_test
        run: |
          docker exec "$SHARED" createdb -U postgres scanner_reader_test
          uv sync --locked --python 3.12
          uv run --frozen pytest -q --tb=short src/test

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.14.4'
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive
      - name: Initialize providers without cloud backend
        run: terraform -chdir=infra/market-scanner init -backend=false -input=false -lockfile=readonly
      - name: Validate runtime infrastructure
        run: terraform -chdir=infra/market-scanner validate
      - name: Test runtime infrastructure with mocked providers
        run: terraform -chdir=infra/market-scanner test
      - name: Validate and test bootstrap infrastructure
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/bootstrap test
      - name: Validate and test drift detection identity
        run: |
          terraform -chdir=infra/drift init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/drift validate
          terraform -chdir=infra/drift test
      - name: Validate and test backend image builder
        run: |
          terraform -chdir=infra/backend-build init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/backend-build validate
          terraform -chdir=infra/backend-build test
      - name: Validate and test the application release identity and guard
        run: |
          terraform -chdir=infra/deploy init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/deploy validate
          terraform -chdir=infra/deploy test
          python3 -m unittest discover -s infra/deploy/tests -p 'test_*.py' -v

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.17'
      - name: Export locked runtime dependencies
        run: uv export --project apps/backend/market-scanner-adk --frozen --no-dev --no-emit-project --format requirements-txt --output-file=${{ runner.temp }}/scanner-requirements.txt
      - name: Audit runtime dependencies
        run: uvx --from pip-audit==2.10.1 --python 3.12 pip-audit -r ${{ runner.temp }}/scanner-requirements.txt --disable-pip --no-deps

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build Linux release image
        run: docker build --platform linux/amd64 --tag scanner:verify apps/backend/market-scanner-adk
      - name: Start the migrated market_scanner database for the smoke test
        uses: ./.github/actions/domain-database
        with:
          domains: market_scanner
      - name: Verify packaged runtime without cloud access
        run: python3 scripts/scanner_image_smoke.py scanner:verify

  publish:
    # Publication is explicitly enabled by each repository owner, never by a PR.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.SCANNER_PUBLISH_ENABLED == 'true'
    needs: [application, infrastructure, dependencies, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: scanner-release
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      PUBLISHER: ${{ vars.GCP_ARTIFACT_PUBLISHER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$GCP_REGION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]]
          [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]
          [[ "$PUBLISHER" == *@"$GCP_PROJECT_ID".iam.gserviceaccount.com ]]
          echo "IMAGE=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/market-scanner/market-scanner-adk:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Build release image before obtaining credentials
        run: docker build --platform linux/amd64 --tag "$IMAGE" apps/backend/market-scanner-adk
      - name: Start the migrated market_scanner database for the smoke test
        uses: ./.github/actions/domain-database
        with:
          domains: market_scanner
      - name: Verify the image to be published
        run: python3 scripts/scanner_image_smoke.py "$IMAGE"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.PUBLISHER }}
          token_format: access_token
          create_credentials_file: false
      - name: Publish verified image and record its immutable reference
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          DOCKER_CONFIG: ${{ runner.temp }}/scanner-docker-auth
        shell: bash
        run: |
          set -euo pipefail
          registry="$GCP_REGION-docker.pkg.dev"
          trap 'docker logout "$registry" >/dev/null 2>&1 || true' EXIT
          printf '%s' "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin "$registry"
          docker push "$IMAGE"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          [[ "$digest" =~ @sha256:[a-f0-9]{64}$ ]]
          printf '### Scanner image\n\nCommit: `%s`\n\nTerraform input:\n```hcl\nimage = "%s"\n```\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
